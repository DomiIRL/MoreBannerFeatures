# Builds every node on each push to a branch and on pull requests, one job per loader.
# Each job configures only its own nodes; configuring all of them makes ForgeGradle set up every Forge version.

name: build
on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    name: build ${{ matrix.loader }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: |
          tasks=$(for n in $(python3 .github/nodes.py ${{ matrix.loader }}); do echo ":$n:build :$n:buildAndCollect"; done)
          ./gradlew --configure-on-demand --no-configuration-cache $tasks
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.loader }}
          path: build/libs/
